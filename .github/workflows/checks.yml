name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Launcher state and process tests
        working-directory: launcher
        run: go test -race ./...
      - name: Importer safety and reconstruction tests
        env:
          PYTHONPATH: importer
        run: python3 -m unittest discover -s importer/tests -v
      - name: Source export and release assembly tests
        run: python3 -m unittest discover -s publish/tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q importer producer unity publish
