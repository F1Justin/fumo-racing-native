<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fumo Racing · 安装与启动</title>
<style nonce="__NONCE__">
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;color:#1d2939;background:#f4f6f9;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,540px);padding:40px;background:white;border:1px solid #e5e9f0;border-radius:20px;box-shadow:0 18px 48px #24334a0a}.eyebrow{color:#667085;font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:28px;letter-spacing:-.04em;margin:10px 0 12px}.intro{font-size:14px;line-height:1.7;color:#667085;margin:0 0 28px}.status{margin:0 0 12px;font-size:15px;line-height:1.7}.actions{display:grid;gap:10px}button{font:inherit;font-size:15px;border:1px solid #d7dce5;border-radius:10px;padding:13px 16px;color:#344054;background:#fff;cursor:pointer}button.primary{border-color:#275cc7;background:#275cc7;color:#fff}button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:default}progress{display:block;width:100%;height:8px;margin:0 0 18px;accent-color:#275cc7}.error{background:#fff5f3;border:1px solid #ffd8d1;padding:12px 14px;border-radius:10px;color:#a52a20;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65;margin:14px 0}details{font-size:13px;color:#667085;margin-top:24px}summary{cursor:pointer}label{display:block;margin-top:14px}input{display:block;width:100%;padding:10px;margin:7px 0;border:1px solid #d7dce5;border-radius:7px;font:inherit;color:#344054}.small{font-size:12px;color:#98a2b3;margin-top:24px}#manualInstall{width:100%;margin-top:8px}.hidden{display:none!important}
#quit{margin-top:14px;font-size:12px;padding:7px 12px}
</style>
<main><div class="eyebrow">Fumo Racing</div><h1 id="heading">导入原版游戏</h1><p class="intro">选择 Touhou Fumo Racing 0.2.1 的 ZIP 压缩包或已解压文件夹。首次导入完成后，即可开始游戏。</p><p id="status" class="status" role="status" aria-live="polite">请选择原版 ZIP 或已解压文件夹。</p><progress id="progress" class="hidden" max="1"></progress><div class="actions"><button id="zip" class="primary">选择原版 ZIP</button><button id="directory">选择原版文件夹</button><button id="launch" class="primary hidden">开始游戏</button></div><p id="error" class="error hidden" role="alert"></p><details id="advanced"><summary>高级选项</summary><label>原版游戏完整路径<input id="source" type="text" placeholder="ZIP 压缩包或已解压的文件夹" autocomplete="off" spellcheck="false"></label><label>安装位置<input id="output" type="text" autocomplete="off" spellcheck="false"></label><button id="manualInstall">开始导入</button></details><div class="small">安装与启动工具 __VERSION__</div><button id="quit">退出工具</button></main>
<script nonce="__NONCE__">
'use strict';const token='__TOKEN__';history.replaceState(null,'',location.pathname);const $=id=>document.getElementById(id);let view={},requestBusy=false,outputEdited=false,closed=false;$('output').oninput=()=>outputEdited=true;
async function api(path,body){const response=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'X-Fumo-Token':token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'操作失败，请重试。');return data}
function showError(message){$('error').textContent=message||'';$('error').classList.toggle('hidden',!message)}
function render(){const busy=view.busy||requestBusy,ready=!!view.canLaunch;$('heading').textContent=ready?'游戏已安装':view.busy?'正在导入原版游戏':'导入原版游戏';$('status').textContent=view.message||'请选择原版 ZIP 或已解压文件夹。';for(const id of ['zip','directory','manualInstall','source','output'])$(id).disabled=busy;$('launch').disabled=busy;$('quit').disabled=busy;$('zip').classList.toggle('hidden',ready);$('directory').classList.toggle('hidden',ready);$('launch').classList.toggle('hidden',!ready);$('advanced').classList.toggle('hidden',ready);$('progress').classList.toggle('hidden',!view.busy);if(view.indeterminate)$('progress').removeAttribute('value');else $('progress').value=view.progress||0;if(!outputEdited)$('output').value=view.outputPath||'';showError(view.error)}
async function refresh(){if(closed)return;try{view=await api('state');if(closed)return;render()}catch(_){showError('无法连接启动工具，请关闭此窗口并重新打开启动工具。')}}
async function install(source){await api('install',{sourcePath:source,outputPath:$('output').value});$('source').value=source}
async function choose(kind){requestBusy=true;render();try{const selected=await api('select',{kind});if(!selected.cancelled)await install(selected.path)}catch(error){view.error=error.message}finally{requestBusy=false;render();await refresh()}}
$('zip').onclick=()=>choose('sourceZip');$('directory').onclick=()=>choose('sourceDirectory');$('manualInstall').onclick=async()=>{requestBusy=true;render();try{await install($('source').value)}catch(error){view.error=error.message}finally{requestBusy=false;render();await refresh()}};$('launch').onclick=async()=>{requestBusy=true;render();try{await api('launch',{});$('status').textContent='游戏正在启动…'}catch(error){view.error=error.message}finally{requestBusy=false;render()}};$('quit').onclick=async()=>{try{await api('quit',{});closed=true;document.querySelector('main').textContent='工具已退出，可以关闭此窗口。'}catch(error){showError(error.message)}};refresh();setInterval(refresh,700);
</script></html>
